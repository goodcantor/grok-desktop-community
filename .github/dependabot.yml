version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    schedule:
      interval: weekly
