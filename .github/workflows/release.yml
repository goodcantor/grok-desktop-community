name: Signed draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v tag matching package version and completed acceptance
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: release-source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19.0'
      - name: Verify exact tag, acceptance and successful native CI without signing secrets
        working-directory: release-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: preflight
        run: node ../release-tools/scripts/release-prerequisites.mjs
  signed-build:
    needs: preflight
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
            args: --win --x64
          - os: macos-15
            target: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            target: macos-x64
            args: --mac --x64
          - os: ubuntu-24.04
            target: linux-x64
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Require signing credentials
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then test -n "$WIN_CSC_LINK" && test -n "$WINDOWS_PUBLISHER_NAME"; fi
          if [ "$RUNNER_OS" = macOS ]; then test -n "$MAC_CSC_LINK" && test -n "$APPLE_API_KEY"; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Build signed artifacts
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            node -e "require('fs').writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), {mode:0o600})"
          fi
          npm run build
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/package.mjs ${{ matrix.args }} --publish never -c.forceCodeSigning=true "-c.win.publisherName=$WINDOWS_PUBLISHER_NAME"
          else
            node scripts/package.mjs ${{ matrix.args }} --publish never -c.forceCodeSigning=true
          fi
      - name: Verify platform signatures and acceptance
        env:
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: node scripts/verify-release.mjs --target ${{ matrix.target }}
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > release/SBOM-${{ matrix.target }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-*.txt
            release/SBOM-*.json
            release/verification-*.json
          if-no-files-found: error
  draft:
    needs: signed-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: signed-*
          path: verified-release-inputs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assemble artifacts and combine macOS update metadata
        run: node scripts/assemble-release.mjs verified-release-inputs verified-release
      - name: Verify complete release set
        run: node scripts/verify-release-set.mjs verified-release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: verified-release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Grok Desktop Community ${{ inputs.tag }}
          draft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          body_path: verified-release/RELEASE-NOTES.md
          files: verified-release/*
