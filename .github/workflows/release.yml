name: Signed draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v tag matching package version and completed acceptance
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  signed-build:
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
            args: --win --x64
          - os: macos-15
            target: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            target: macos-x64
            args: --mac --x64
          - os: ubuntu-24.04
            target: linux-x64
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Verify release prerequisites
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TARGET: ${{ matrix.target }}
        run: node scripts/release-prerequisites.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Build signed artifacts
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            node -e "require('fs').writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), {mode:0o600})"
          fi
          npm run build
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/package.mjs ${{ matrix.args }} --publish never -c.forceCodeSigning=true "-c.win.publisherName=$WINDOWS_PUBLISHER_NAME"
          else
            node scripts/package.mjs ${{ matrix.args }} --publish never -c.forceCodeSigning=true
          fi
      - name: Verify platform signatures and acceptance
        env:
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: node scripts/verify-release.mjs --target ${{ matrix.target }}
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > release/SBOM-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: signed-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-*.txt
            release/SBOM-*.json
            release/verification-*.json
          if-no-files-found: error
  draft:
    needs: signed-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v6
        with:
          pattern: signed-*
          path: verified-release
          merge-multiple: true
      - name: Verify complete release set
        run: node scripts/verify-release-set.mjs verified-release
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: verified-release/*
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Grok Desktop Community ${{ inputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body_path: verified-release/RELEASE-NOTES.md
          files: verified-release/*
